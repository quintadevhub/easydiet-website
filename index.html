
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F4EC" />

    <!-- Website Title -->
    <title>EasyDiet | Personalised Nutrition & Diet Plans</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Discover personalised diet plans for healthy weight loss, weight gain and better everyday nutrition with EasyDiet. Better Food, Healthier Life."

    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/easydiet-favicon.svg" />

    <!-- Open Graph: WhatsApp, LinkedIn, Facebook -->

    <meta property="og:site_name" content="EasyDiet" />
    <meta
      property="og:title"
      content="EasyDiet — Better Food, Healthier Life"
    />

      property="og:description"
      content="Personalised nutrition for your goals, preferences and everyday lifestyle."
    />

    <!-- Social Sharing Thumbnail -->
    <meta
      property="og:image"
      content="https://easydiet.in/images/easydiet-og.jpg"
    />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EasyDiet personalised nutrition and diet plans" />

      name="twitter:title"
      content="EasyDiet — Better Food, Healthier Life"
    />
    <meta
      name="twitter:description"
      content="Personalised nutrition for healthy weight loss, weight gain and a healthier lifestyle."

      name="twitter:image"
      content="https://easydiet.in/images/easydiet-og.jpg"
